<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <title>HoloSuite rounded glass bezel</title>
  <!-- Slice 48 units in from each edge. Keep corner geometry inside those guides. -->
  <g id="housing">
    <rect x="2" y="2" width="156" height="156" rx="40" fill="#0b192a" stroke="#294c66" stroke-width="3"/>
    <rect x="8" y="8" width="144" height="144" rx="34" fill="none" stroke="#184661" stroke-width="8"/>
  </g>
  <g id="edge-light" fill="none">
    <rect x="8" y="8" width="144" height="144" rx="34" stroke="#519bb8" stroke-width="2"/>
    <rect x="14" y="14" width="132" height="132" rx="28" stroke="#153951" stroke-width="2"/>
  </g>
</svg>
