<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <title>Cassette Futurism molded equipment housing</title>
  <!-- Slice 48 units in from each edge. The chrome runs through the edge strips. -->
  <g id="molded-case">
    <rect x="2" y="2" width="156" height="156" rx="30" fill="#a6a393" stroke="#777e76" stroke-width="3"/>
    <rect x="6" y="6" width="148" height="148" rx="26" fill="none" stroke="#ddd7c4" stroke-width="2"/>
    <rect x="13" y="13" width="134" height="134" rx="20" fill="#a6a393" stroke="#777e76" stroke-width="3"/>
    <rect x="18" y="18" width="124" height="124" rx="16" fill="none" stroke="#c7c0ae" stroke-width="2"/>
  </g>
  <g id="case-screws" fill="#777e76" stroke="#414f4e">
    <circle cx="16" cy="16" r="3.5"/>
    <circle cx="144" cy="16" r="3.5"/>
    <circle cx="16" cy="144" r="3.5"/>
    <circle cx="144" cy="144" r="3.5"/>
    <path d="m14 18 4-4m124 4 4-4M14 146l4-4m124 4 4-4" fill="none"/>
  </g>
</svg>
