<section class="hs-application hs-application--hacking hh-shell hh-launcher-shell">
  <div class="hs-background" aria-hidden="true"></div>
  <div class="hs-frame" aria-hidden="true">
    <img class="hs-frame-piece hs-frame-piece--default hs-frame-corner hs-frame-corner--top-left" src="{{frameAssetBase}}/hs-frame-corner--top-left.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--default hs-frame-corner hs-frame-corner--top-right" src="{{frameAssetBase}}/hs-frame-corner--top-right.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--default hs-frame-corner hs-frame-corner--bottom-left" src="{{frameAssetBase}}/hs-frame-corner--bottom-left.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--default hs-frame-corner hs-frame-corner--bottom-right" src="{{frameAssetBase}}/hs-frame-corner--bottom-right.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--default hs-frame-edge hs-frame-edge--left" src="{{frameAssetBase}}/hs-frame-edge--left.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--default hs-frame-edge hs-frame-edge--right" src="{{frameAssetBase}}/hs-frame-edge--right.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--default hs-frame-header" src="{{frameAssetBase}}/hs-frame-header.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--space-police hs-frame-corner hs-frame-corner--top-left" src="{{frameAssetBase}}/hs-frame-corner--top-left--space-police.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--space-police hs-frame-corner hs-frame-corner--top-right" src="{{frameAssetBase}}/hs-frame-corner--top-right--space-police.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--space-police hs-frame-corner hs-frame-corner--bottom-left" src="{{frameAssetBase}}/hs-frame-corner--bottom-left--space-police.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--space-police hs-frame-corner hs-frame-corner--bottom-right" src="{{frameAssetBase}}/hs-frame-corner--bottom-right--space-police.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--space-police hs-frame-edge hs-frame-edge--left" src="{{frameAssetBase}}/hs-frame-edge--left--space-police.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--space-police hs-frame-edge hs-frame-edge--right" src="{{frameAssetBase}}/hs-frame-edge--right--space-police.svg" alt="">
    <img class="hs-frame-piece hs-frame-piece--space-police hs-frame-header" src="{{frameAssetBase}}/hs-frame-header--space-police.svg" alt="">
  </div>
  <form class="hs-content holosuite-hacking-launcher">
    <header class="holosuite-hacking-launcher-header">
      <p class="hh-kicker">HoloSuite / hacking deck</p>
      <h2>Launch Minigame</h2>
      <span>Dispatch intrusion training to a player terminal.</span>
    </header>

  <div class="form-group">
    <label>Minigame</label>
    <select name="minigameType">
      {{#each minigames}}
        <option value="{{id}}">{{title}}</option>
      {{/each}}
    </select>
  </div>

  <div class="form-group">
    <label>Player</label>
    <select name="userId" required>
      {{#each users}}
        <option value="{{id}}">{{name}}</option>
      {{/each}}
    </select>
  </div>

  <div class="form-group">
    <label>Hacker character</label>
    <select name="actorId">
      {{#each actors}}
        <option value="{{id}}">{{name}} ({{ownerNames}})</option>
      {{else}}
        <option value="">Use assigned character</option>
      {{/each}}
    </select>
  </div>

  <div class="form-group">
    <label>Skill</label>
    <select name="skillId" required>
      {{#each skills}}
        <option value="{{id}}" data-skill-label="{{name}}" data-skill-modifier="{{modifier}}">{{label}}</option>
      {{/each}}
    </select>
  </div>

  <div class="form-group">
    <label>DC</label>
    <input type="number" name="dc" value="{{defaultDc}}" step="1" />
  </div>

  <div class="form-group">
    <label>Live audience</label>
    <select name="liveAudience">
      {{#each liveAudiences}}
        <option value="{{value}}" {{#if selected}}selected{{/if}}>{{label}}</option>
      {{/each}}
    </select>
  </div>

  <div class="form-group">
    <label>Test roll</label>
    <input type="number" name="testRollTotal" value="{{defaultTestRoll}}" step="1" />
  </div>

    <footer class="holosuite-hacking-launcher-actions">
      <button type="button" data-action="test-self"><i class="fa-solid fa-gamepad"></i> Test Yourself</button>
      <button type="submit" data-action="start"><i class="fa-solid fa-paper-plane"></i> Send to Player</button>
    </footer>
  </form>
  <div class="hs-effects" aria-hidden="true"></div>
</section>
